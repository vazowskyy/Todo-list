{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto p-6">
    <div class="flex items-center p-4 mb-4 text-sm text-red-800 border border-red-300 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400 dark:border-red-800" role="alert">
        <svg class="flex-shrink-0 inline w-4 h-4 mr-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
            <path d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-8-4a1 1 0 00-.993.883L9 7v4a1 1 0 001.993.117L11 11V7a1 1 0 00-1-1zm0 8a1.25 1.25 0 100-2.5A1.25 1.25 0 0010 15z"/>
        </svg>
        <span class="sr-only">Error</span>
        <div>
            Error – password not updated
        </div>
    </div>

    <div class="flex space-x-4">
        <a href="{{ url_for('auth.login') }}"
           class="px-4 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg text-sm font-medium focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-blue-800">
            Login
        </a>
        <a href="{{ url_for('views.home') }}"
           class="px-4 py-2 text-gray-900 bg-gray-100 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-200 focus:z-10 focus:ring-4 focus:outline-none focus:ring-gray-200 dark:bg-gray-700 dark:text-white dark:border-gray-600 dark:hover:bg-gray-600 dark:focus:ring-gray-500">
            Home
        </a>
    </div>
</div>
{% endblock %}
