<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Home{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename = 'style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename = 'favicon.png') }}">
</head>

<body>

  <nav class="bg-white border-gray-200 dark:bg-gray-900">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
      <a href="https://github.com/vazowskyy/Todo-list" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="/static/images/icons/github-mark-white.svg" class="h-8" alt="Github Logo" />
        <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">Github</span>
      </a>
      <button data-collapse-toggle="navbar-default" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
        aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15" />
        </svg>
      </button>
      <div class="hidden w-full md:block md:w-auto" id="navbar-default">
        <ul
          class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-gray-100 rounded-lg bg-gray-50 md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-white dark:bg-gray-800 md:dark:bg-gray-900 dark:border-gray-700">
          <li>
            <a href="/"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Home</a>
          </li>
          {% if current_user.is_authenticated %}
          <li class="nav-item">
            <a href="/todo_list" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Todo List</a>
          </li>
          
          <li class="nav-item">
            <a href="/logout" class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Logout</a>
          </li>
          {% else %}
          
          <li>
            <a href="/register"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Register</a>
          </li>
          <li>
            <a href="/login"
              class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:border-0 md:hover:text-blue-700 md:p-0 dark:text-white md:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white md:dark:hover:bg-transparent">Login</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  
    {% block content %}
  
    {% endblock %}
  

  <footer class="bg-white shadow-sm dark:bg-gray-800">
  <div class="w-full mx-auto max-w-screen-xl p-4 md:flex md:items-center md:justify-between">
    <span class="text-sm text-gray-500 sm:text-center dark:text-gray-400">
      © 2025 <a href="/" class="hover:underline font-semibold">TaskManager</a>. All rights reserved.
    </span>

    <div class="flex items-center space-x-6 mt-3 md:mt-0">
      <a href="https://www.linkedin.com/in/michal-kryczka/">
        <img src="/static/images/icons/linkedin.png" class="h-10 text-gray-500 hover:text-gray-900 dark:hover:text-white" alt="Linkeding Logo" />
      </a>
      <a href="https://github.com/vazowskyy/Todo-list">
        <img src="/static/images/icons/github-mark-white.svg" class="h-8 text-gray-500 hover:text-gray-900 dark:hover:text-white" alt="Github Logo" />
      </a>
        
      
      <!-- Linki -->
      <ul class="flex space-x-4 text-sm font-medium dark:text-gray-400">
        <a href="https://github.com/vazowskyy/Todo-list#readme" class="hover:underline">README</a>
        <a href="https://github.com/vazowskyy/Todo-list/blob/main/LICENSE" class="hover:underline">MIT License</a>
        <li><a href="mailto:m.kryczka03@gmail.com" class="hover:underline">Contact</a></li>
      </ul>
    </div>
  </div>
</footer>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
</body>
</html>
