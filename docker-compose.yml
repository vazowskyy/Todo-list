services:

  db:
    image: postgres:16
    restart: always 
    environment:
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes: 
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:      
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -t 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  app:
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    build: .
    container_name: flask-app
    command: gunicorn TodoAPP.main:app --bind 0.0.0.0:80 --reload
    ports:
      - 80:80
    volumes:
      - ./TodoAPP:/app/TodoAPP
    # environment:
    #   - DATABASE_URL=
  